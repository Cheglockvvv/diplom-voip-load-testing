context=lab
disallow=all
allow=ulaw
auth=1000
aors=1000

[1000]
type=auth
auth_type=userpass
username=1000
password=1000

[1000]
type=aor
max_contacts=5

[1001]
type=endpoint
transport=transport-udp
context=lab
