services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: voip-asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: worker
    container_name: voip-worker
    environment:
      - WORKER_ADDR=:8081
      - WORKER_GRPC_ADDR=:19091
    ports:
      - "8081:8081"
      - "19091:19091"
    depends_on:
      asterisk:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  controller:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: controller
    container_name: voip-controller
    environment:
      - CONTROLLER_ADDR=:8080
      - WORKER_GRPC_ADDR=worker:19091
    ports:
      - "8080:8080"
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: voip-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      controller:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 8

  grafana:
    image: grafana/grafana:11.2.0
    container_name: voip-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
